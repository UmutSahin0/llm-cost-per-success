name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q llm_cost_per_success
      - name: Analysis runs on the bundled sample
        run: python -m llm_cost_per_success general analyze --experiment examples/sample-run
      - name: CLI parses all commands
        run: |
          python -m llm_cost_per_success general run --help
          python -m llm_cost_per_success tools run --help
          python -m llm_cost_per_success tools compare --help
